<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina web</title>
    <style>
        .contenedor{
            background-color: dimgray;
            font-family: Arial, Helvetica, sans-serif;
        }

        .banner{
            text-align: center;
        }

        .menu{
            display: flex;
            list-style: none;
            gap: 40px;
            justify-content: center;
        }

        .menu li{
            padding-left: 5%;
            text-align: center;
        }

        .menu a{
            color: inherit;
            text-decoration: none;
            display: block;
            padding: 15px 25px;
            transition: background-color 0.3s, color 0.3s;
        }

        .menu a:hover{
            background-color: aliceblue;
            color:black;
            
        }

        .menu li.perfil img {
        width: 40px;           /* tamaño pequeño */
        height: 40px;          /* igual que el ancho para que sea cuadrada */
        border-radius: 50%;    /* hace la imagen redonda */
        object-fit: cover;     /* ajusta la imagen sin deformarla */
        }

        .menu li.perfil{
            
            
        }

        .card {
        color: azure;
        background: rgb(56, 55, 55);
        border-radius: 8px;
        margin: 24px 0 8px 0;
        font-size: 1.3em;
        font-weight: bold;
        padding: 5px 0;
        }
    </style>
</head>

<body class="contenedor">
    <div class="card">
        <ul class="menu">
            <li><a href="#Acerca de mi">Acerca de mi</a></li>
            <li><a href="#Portafolio web">Portafolio web</a></li>
            <li><a href="#Habilidades">Habilidades</a></li>
            <li><a href="#Contacto">Contacto</a></li>
            <li class="perfil">
                <img src="foto cv 1.jpg" alt="Foto perfil">
            </li>
        </ul>
    </div>
</body>
</html>
